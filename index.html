<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="每日班級訂餐與點餐統計表單 - 專為 IG、Chrome、Safari 優化的手機訂餐系統">
  <meta name="theme-color" content="#12121c">
  <title>班級每日訂餐統計</title>
  
  <!-- 外部字體與圖示 -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  
  <!-- 高質感黑夜模式 CSS 樣式表 -->
  <style>
    :root {
      --bg-dark: #12121c;
      --card-bg: rgba(30, 30, 45, 0.7);
      --primary-color: #6366f1;
      --accent-color: #a855f7;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0;
      padding-bottom: 90px;
    }
    .app-header {
      background: linear-gradient(135deg, #1e1b4b, #311042);
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title { margin: 0; font-size: 1.4rem; font-weight: 900; }
    .header-timer { font-size: 0.8rem; color: var(--text-sub); display: flex; align-items: center; gap: 5px; margin-top: 5px; }
    .pulse-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    .icon-btn { background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; border-radius: 50%; transition: background 0.3s; }
    .icon-btn:hover { background: rgba(255,255,255,0.1); }
    .main-container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .glass-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-color); border-radius: 16px; padding: 15px; margin-bottom: 20px; }
    .user-bar { display: flex; align-items: center; justify-content: space-between; }
    .user-bar-label { display: flex; align-items: center; gap: 8px; color: var(--text-sub); }
    .user-bar-select-wrap { position: relative; width: 60%; }
    .user-dropdown { width: 100%; background: #0f172a; color: #fff; border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; appearance: none; font-size: 1rem; }
    .select-arrow { position: absolute; right: 8px; top: 8px; pointer-events: none; }
    .status-banner { margin-bottom: 20px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; margin-right: 5px; }
    .badge-date { background: #334155; }
    .badge-status { background: #1e3a8a; color: #3b82f6; }
    .banner-sub { font-size: 0.75rem; color: var(--text-sub); margin-top: 5px; }
    .btn { background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.3s; font-size: 1rem; }
    .btn-block { width: 100%; box-sizing: border-box; }
    .btn-primary { background: var(--primary-color); }
    .btn-accent { background: var(--accent-color); }
    .empty-card { text-align: center; padding: 30px; color: var(--text-sub); }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #09090b; padding: 15px; border-top: 1px solid var(--border-color); display: flex; justify-content: center; }
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .hidden { display: none !important; }
    .modal-card { width: 100%; max-width: 450px; box-sizing: border-box; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: var(--text-sub); }
    .form-group input, .form-group textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; font-size: 1rem; }
    .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 350px; }
  </style>
</head>
<body>

  <!-- 頂部標題區 -->
  <header class="app-header">
    <div class="header-content">
      <div class="header-brand">
        <div>
          <h1 class="brand-title">班級訂餐統計</h1>
          <div class="header-timer">
            <span class="pulse-dot"></span>
            <span id="tw-clock">台灣時間 --:--:--</span>
            <span class="timer-divider">|</span>
            <span id="reset-countdown">距 24:00 重置: --:--</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-history" class="icon-btn" title="歷史紀錄"><span class="material-icons-round">history</span></button>
        <button id="btn-manage-students" class="icon-btn" title="名單設定"><span class="material-icons-round">people</span></button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- 身分選擇 -->
    <section class="user-bar glass-card">
      <div class="user-bar-label"><span class="material-icons-round">account_circle</span><span>我是誰：</span></div>
      <div class="user-bar-select-wrap">
        <select id="user-select" class="user-dropdown"></select>
        <span class="material-icons-round select-arrow">arrow_drop_down</span>
      </div>
    </section>

    <!-- 狀態公告 -->
    <div class="status-banner">
      <div class="banner-info">
        <span class="badge badge-date" id="current-date-badge">----/--/--</span>
        <span class="badge badge-status">訂餐統計進行中</span>
      </div>
      <div class="banner-sub">每天 24:00 台灣時間自動結單歸檔並重置表單</div>
    </div>

    <!-- 功能按鈕 -->
    <div class="action-row">
      <button id="btn-add-store" class="btn btn-primary btn-block"><span class="material-icons-round">add_business</span><span>張貼今日店家</span></button>
    </div>

    <!-- 店家與點餐清單區 -->
    <section id="stores-container" class="stores-section"></section>

    <!-- 空白狀態 -->
    <div id="empty-stores-state" class="empty-card glass-card">
      <div class="empty-icon"><span class="material-icons-round" style="font-size: 48px; color: var(--text-sub);">store</span></div>
      <h3>今日尚未張貼任何店家</h3>
      <p>點擊上方「張貼今日店家」按鈕新增店家，讓大家開始留言點餐！</p>
    </div>
  </main>

  <!-- 底部固定按鈕 -->
  <div class="bottom-bar">
    <button id="btn-copy-all" class="btn btn-accent btn-block"><span class="material-icons-round">content_copy</span><span>一鍵複製今日訂餐統計</span></button>
  </div>

  <!-- 彈出視窗：新增店家 -->
  <div id="modal-store" class="modal-overlay hidden">
    <div class="modal-card glass-card">
      <div class="modal-header">
        <h3>張貼今日店家</h3>
        <button class="modal-close icon-btn" data-close="modal-store"><span class="material-icons-round">close</span></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="store-name-input">店家名稱</label>
          <input type="text" id="store-name-input" placeholder="例如：大呼過癮、麥當勞" required>
        </div>
        <button id="btn-save-store" class="btn btn-primary btn-block">發布店家</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
</body>
</html>
